Name: harbour-fotokopierer
Summary: Document Scanner
Version: 0.4.6
Release: 1%{?dist}
# The contents of the Group field should be one of the groups listed here:
# http://gitorious.org/meego-developer-tools/spectacle/blobs/master/data/GROUPS
Group: Qt/Qt
URL: https://chiselapp.com/user/fifr/repository/fotokopierer
License: GPLv3+
# This must be generated before uploading a package to a remote build service.
# Usually this line does not need to be modified.

Sources:
- '%{name}-%{version}.tar.gz'
- '%{opencv_version}.zip'
- 'podofo-%{podofo_version}.tar.gz'
- 'freetype-%{freetype_version}.tar.gz'
Description: |
  A camera-scanning application for Sailfish OS.
Configure: none
# Do not use automatic builder.
Builder: none

PkgBR:
  - cmake
  - qt5-qtmultimedia-plugin-audio-alsa
  - qt5-qtmultimedia-plugin-audio-pulseaudio
  - qt5-qtmultimedia-plugin-mediaservice-gstaudiodecoder
  - qt5-qtmultimedia-plugin-mediaservice-gstcamerabin
  - qt5-qtmultimedia-plugin-mediaservice-gstmediacapture
  - qt5-qtmultimedia-plugin-mediaservice-gstmediaplayer
  - qt5-qtmultimedia-plugin-mediaservice-irisradio
  - qt5-qtmultimedia-plugin-mediaservice-irisradio
  - qt5-qtmultimedia-plugin-playlistformats-m3u
  - qt5-qtmultimedia-plugin-resourcepolicy-resourceqt
  - qt5-qtmultimedia-plugin-video-eglvideonode

# This section specifies build dependencies that are resolved using pkgconfig.
PkgConfigBR:
  - sailfishapp >= 1.0.2
  - Qt5Core
  - Qt5Concurrent
  - Qt5Gui
  - Qt5Multimedia
  - Qt5Qml
  - Qt5Quick
  - openssl >= 1.1
  - libpng16
  - zlib

# Runtime dependencies which are not automatically detected
Requires:
  - sailfishsilica-qt5 >= 0.10.9
  # - zlib  # warum darf ich das nicht? libz ist doch erlaubt ...

# All installed files
Files:
  - '%{_bindir}'
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/icons/hicolor/*/apps/%{name}.png'
  #- '%{_datadir}/%{name}'

# For more information about yaml and what's supported in Sailfish OS
# build system, please see https://wiki.merproject.org/wiki/Spectacle
